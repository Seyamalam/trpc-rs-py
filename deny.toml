# cargo-deny configuration for trpc-rs-py (MISSION.md section 7).
# Run: cargo deny check  (see scripts/audit.sh)

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# RustSec advisory database check (cargo-audit equivalent).
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

# Reject wildcard (`*`) dependency specifications and, by default, multiple
# versions of the same crate in the lockfile are warnings only.
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

# Workspace license is MIT (Cargo.toml [workspace.package]). Dependencies are
# restricted to common permissive licenses; anything else fails the check.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
exceptions = []

# Only crates.io is an allowed dependency source.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
