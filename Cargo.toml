[workspace]
resolver = "2"
members = ["crates/trpc-core", "crates/trpc-py"]

# Single source of truth for the version (section 12 of MISSION.md).
[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Seyamalam/trpc-rs-py"
authors = ["Seyamalam <seyamalam41@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documented exceptions (docs/architecture.md):
unwrap_used = "allow"        # allowed only in tests
expect_used = "allow"        # allowed only in tests

[profile.release]
lto = true
codegen-units = 1
strip = true
