[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "trpc-rs-py"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.scripts]
trpc-py = "trpc_rs_py.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "typing-extensions>=4.8",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "maturin>=1.16,<2",
    "starlette>=0.41",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pytest-benchmark>=5.0",
]

[tool.maturin]
python-source = "python"
module-name = "trpc_rs_py._core"
manifest-path = "crates/trpc-py/Cargo.toml"
features = ["extension-module"]

[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "D100", "D101", "D102"]
"benchmarks/**" = ["D103"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["python", "tests/typing"]
explicit_package_bases = true
mypy_path = "python"

[tool.pyright]
include = ["python", "tests/typing"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
