site_name: trpc-rs-py
site_description: tRPC for Python backends, powered by a Rust core
site_url: https://trpc-rs-py.vercel.app/docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Core concepts: concepts.md
  - Starter template: starter.md
  - Guides:
